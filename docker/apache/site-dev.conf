ServerName explorer.magrathea.localhost.com

<VirtualHost *:80>
	ServerName explorer.magrathea.localhost.com
	ServerAlias www.explorer.magrathea.localhost.com

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html/src
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
	Options Indexes FollowSymLinks

	<Directory /var/www/html/src>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# storage.conf's local_path lives outside api/src's docroot -- route it
	# here so local_url (.../storage) resolves. Not needed for s3/R2 drivers.
	Alias /storage /var/www/storage
	<Directory /var/www/storage>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Admin app (Vue 3 + Vite) lives in the separate app/ project at the repo
	# root -- served at /app, sibling to the versioned JSON API at /api/v1.
	# docker-compose.yml mounts the repo-root dist/ (Vite's build output,
	# committed to git) here -- this container path stays fixed either way.
	Alias /app /var/www/html/app
	<Directory /var/www/html/app>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
