ServerName explorer.magrathea.localhost.com

<VirtualHost *:80>
	ServerName explorer.magrathea.localhost.com
	ServerAlias www.explorer.magrathea.localhost.com

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html/api
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
	Options Indexes FollowSymLinks

	<Directory /var/www/html/api>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# storage.conf's local_path lives outside src/api's docroot -- route it
	# here so local_url (.../storage) resolves. Not needed for s3/R2 drivers.
	Alias /storage /var/www/storage
	<Directory /var/www/storage>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# New Angular/Vue admin app lives outside src/api's docroot too --
	# served at /app, sibling to the versioned JSON API at /api/v1.
	# Placeholder until the real SPA build lands here.
	Alias /app /var/www/html/app
	<Directory /var/www/html/app>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
